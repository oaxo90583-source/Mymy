services:
  - type: web
    name: muaythai-line-bot
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_ADMIN_IDS
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: MUAYTHAI_DB_PATH
        value: /app/data/muaythai.db
      - key: MUAYTHAI_BANK
        value: "959-243-7898"
      - key: MUAYTHAI_BANK_NAME
        value: "ไทยพานิชย์"
      - key: MUAYTHAI_MAX_CAP
        value: "0"
